<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parag Manoj Mali | Junior UX/UI Designer, Dublin</title>
  <meta name="description" content="Junior UX/UI Designer and frontend developer in Dublin. Figma, user flows, wireframes, prototypes, usability testing, design systems and responsive digital experiences." />
  <meta property="og:title" content="Parag Manoj Mali | Junior UX/UI Designer" />
  <meta property="og:description" content="I design clear, responsive digital experiences and help bring them from Figma to working product." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#0D5C4D" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --ink:#17312b;
      --ink-2:#40534f;
      --muted:#6c7d78;
      --paper:#fbfcf9;
      --surface:#ffffff;
      --soft:#eef5f1;
      --soft-2:#f5f0e7;
      --line:#dfe8e3;
      --brand:#0d5c4d;
      --brand-2:#174f44;
      --accent:#f2b85b;
      --shadow:0 22px 60px rgba(27,62,53,.10);
      --display:'Manrope',system-ui,sans-serif;
      --body:'DM Sans',system-ui,sans-serif;
      --wrap:min(1180px,calc(100% - 40px));
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:var(--body);
      color:var(--ink);
      background:var(--paper);
      line-height:1.65;
      -webkit-font-smoothing:antialiased;
    }
    a{color:inherit}
    img{max-width:100%;display:block}
    button,a{ -webkit-tap-highlight-color:transparent }
    :focus-visible{outline:3px solid rgba(242,184,91,.8);outline-offset:3px;border-radius:8px}

    .wrap{width:var(--wrap);margin:0 auto}
    .topbar{
      position:sticky;top:0;z-index:40;
      background:rgba(251,252,249,.88);
      backdrop-filter:blur(16px);
      border-bottom:1px solid rgba(223,232,227,.9);
    }
    .nav{height:74px;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .brand{font-family:var(--display);font-weight:800;text-decoration:none;letter-spacing:-.03em;font-size:19px}
    .brand span{color:var(--brand)}
    .navlinks{display:flex;align-items:center;gap:8px}
    .navlinks a{font-size:14px;font-weight:600;text-decoration:none;padding:9px 11px;border-radius:999px;color:var(--ink-2)}
    .navlinks a:hover{background:var(--soft);color:var(--brand)}
    .menu{display:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font:inherit}

    .hero{padding:92px 0 70px;position:relative;overflow:hidden}
    .hero:before{
      content:'';position:absolute;width:520px;height:520px;border-radius:50%;
      background:radial-gradient(circle,rgba(242,184,91,.25),rgba(242,184,91,0) 68%);
      right:-170px;top:-150px;pointer-events:none;
    }
    .hero-grid{display:grid;grid-template-columns:1.18fr .82fr;gap:68px;align-items:center}
    .kicker{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--brand);background:var(--soft);padding:8px 12px;border-radius:999px;margin-bottom:22px}
    .kicker:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--brand)}
    h1,h2,h3{font-family:var(--display);letter-spacing:-.04em;margin:0}
    h1{font-size:clamp(46px,7vw,84px);line-height:.98;max-width:900px}
    .hero h1 span{color:var(--brand)}
    .lede{font-size:clamp(19px,2vw,23px);line-height:1.55;color:var(--ink-2);max-width:720px;margin:28px 0 0}
    .hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;font-weight:700;font-size:14px;border-radius:12px;padding:13px 17px;border:1px solid var(--line);background:var(--surface)}
    .btn.primary{background:var(--brand);color:white;border-color:var(--brand)}
    .btn.primary:hover{background:var(--brand-2)}
    .btn:hover{transform:translateY(-1px)}

    .snapshot{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow);position:relative}
    .snapshot:after{content:'';position:absolute;right:-10px;bottom:-10px;width:120px;height:120px;border:2px solid var(--accent);border-radius:26px;z-index:-1}
    .snapshot-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .snapshot-title{font-size:13px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--muted)}
    .availability{font-size:12px;font-weight:700;color:var(--brand);display:flex;gap:7px;align-items:center}
    .availability:before{content:'';width:7px;height:7px;border-radius:50%;background:#2ca474;box-shadow:0 0 0 4px rgba(44,164,116,.12)}
    .snapshot-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .stat{border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:16px}
    .stat strong{font-family:var(--display);font-size:24px;display:block;letter-spacing:-.04em}
    .stat span{font-size:13px;color:var(--muted)}
    .snapshot-note{margin:16px 2px 0;color:var(--ink-2);font-size:14px}

    section{padding:86px 0}
    .section-head{display:grid;grid-template-columns:.7fr 1.3fr;gap:50px;align-items:end;margin-bottom:40px}
