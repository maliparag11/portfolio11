<style>
:root{
  --ink:#0B1220;
  --ink-2:#111A2B;
  --ink-3:#162135;
  --line:#22304a;
  --paper:#E8EDF5;
  --muted:#8B9AB3;
  --signal:#F0B429;
  --signal-dim:#8a6a1c;
  --ok:#6FD3B8;
  --display:'Archivo',system-ui,sans-serif;
  --body:'Public Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sidebar-w:240px;
  --pad:clamp(20px,5vw,64px);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:var(--body);
  font-weight:300;
  font-size:16.5px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:2px}

/* ---------- status bar ---------- */
.statusbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:14px;
  padding:0 var(--pad);height:38px;
  background:rgba(11,18,32,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;
  color:var(--muted);
}
.statusbar .host{color:var(--paper);font-weight:500}
.statusbar .sep{color:var(--line)}
.statusbar .code{color:var(--ok)}
.dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--ok);display:inline-block;
  margin-right:6px;vertical-align:1px;
}
.statusbar .region{margin-left:auto}

/* ---------- shell ---------- */
.shell{display:block}
@media(min-width:940px){
  .shell{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr)}
}

/* ---------- sidebar ---------- */
.rail{
  border-bottom:1px solid var(--line);
  position:sticky;top:38px;z-index:40;
  background:var(--ink);
  overflow-x:auto;
}
.rail nav{display:flex;gap:4px;padding:10px var(--pad)}
.rail a{
  font-family:var(--mono);font-size:11.5px;text-decoration:none;
  color:var(--muted);white-space:nowrap;
  padding:5px 10px;border-radius:4px;
}
.rail a[aria-current="true"]{color:var(--signal);background:var(--ink-3)}

@media(min-width:940px){
  .rail{
    position:sticky;top:38px;height:calc(100vh - 38px);
    border-bottom:0;border-right:1px solid var(--line);
